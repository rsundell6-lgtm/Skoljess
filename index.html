<!DOCTYPE html>
<html lang="sv">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">

<title>Jessii Koll</title>

<style>
*{
    box-sizing:border-box;
}

:root{
    --bg:#080a0e;
    --card:#12161c;
    --card2:#1a2028;
    --border:#29313c;
    --text:#fff;
    --muted:#9ca6b3;
    --blue:#6ea8fe;
    --yellow:#facc15;
    --green:#4ade80;
    --red:#fb7185;
}

body{
    margin:0;
    padding:14px;
    background:var(--bg);
    color:var(--text);
    font-family:Arial,Helvetica,sans-serif;
}

.container{
    width:100%;
    max-width:760px;
    margin:auto;
}

header{
    text-align:center;
    padding:10px 0 20px;
}

.logo{
    font-size:34px;
    font-weight:900;
    letter-spacing:1px;
}

.subtitle{
    color:var(--muted);
    margin-top:5px;
}

.card{
    background:var(--card);
    border:1px solid var(--border);
    border-radius:18px;
    padding:16px;
    margin-bottom:15px;
}

.title{
    font-size:20px;
    font-weight:900;
    margin-bottom:12px;
}

textarea,
input{
    width:100%;
    border:1px solid var(--border);
    border-radius:12px;
    background:#0c0f14;
    color:#fff;
    padding:13px;
    font-size:16px;
    outline:none;
}

textarea:focus,
input:focus{
    border-color:var(--blue);
}

textarea{
    min-height:220px;
    resize:vertical;
}

button{
    width:100%;
    border:0;
    border-radius:12px;
    padding:14px;
    margin-top:10px;
    font-size:16px;
    font-weight:900;
    cursor:pointer;
    background:var(--blue);
    color:#07101c;
}

button.secondary{
    background:var(--card2);
    color:#fff;
    border:1px solid var(--border);
}

button.danger{
    background:#351820;
    color:#ff9aaa;
}

.grid{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:10px;
}

.message{
    margin-top:10px;
    padding:12px;
    border-radius:12px;
    background:#142131;
    border:1px solid #29405d;
    color:#dbe9ff;
    line-height:1.45;
}

.hidden{
    display:none;
}

.day{
    background:var(--card);
    border:1px solid var(--border);
    border-radius:18px;
    overflow:hidden;
    margin-bottom:12px;
}

.dayHeader{
    background:var(--card2);
    padding:15px;
    display:flex;
    justify-content:space-between;
    align-items:center;
    gap:10px;
}

.weekday{
    color:var(--blue);
    text-transform:uppercase;
    font-size:13px;
    font-weight:900;
}

.date{
    font-size:22px;
    font-weight:900;
    margin-top:3px;
}

.today{
    background:#173824;
    color:var(--green);
    padding:6px 9px;
    border-radius:8px;
    font-size:12px;
    font-weight:900;
}

.event{
    padding:15px;
    border-top:1px solid var(--border);
}

.time{
    color:var(--yellow);
    font-size:21px;
    font-weight:900;
}

.eventTitle{
    font-size:18px;
    font-weight:900;
    margin-top:4px;
}

.eventInfo{
    color:#c4ccd6;
    margin-top:7px;
    line-height:1.45;
    white-space:pre-wrap;
}

.source{
    display:inline-block;
    margin-top:9px;
    padding:4px 8px;
    border-radius:7px;
    background:#252b34;
    color:var(--muted);
    font-size:11px;
    font-weight:900;
}

.buttons{
    display:flex;
    gap:8px;
    margin-top:10px;
}

.buttons button{
    margin:0;
    padding:9px;
    font-size:13px;
}

.empty{
    text-align:center;
    color:var(--muted);
    padding:25px 10px;
    line-height:1.5;
}

.modal{
    position:fixed;
    inset:0;
    z-index:100;
    background:rgba(0,0,0,.78);
    display:flex;
    justify-content:center;
    align-items:center;
    padding:15px;
}

.modal.hidden{
    display:none;
}

.modalBox{
    width:100%;
    max-width:500px;
    background:var(--card);
    border:1px solid var(--border);
    border-radius:18px;
    padding:18px;
}

.modalTitle{
    font-size:21px;
    font-weight:900;
    margin-bottom:12px;
}

@media(max-width:560px){

    body{
        padding:10px;
    }

    .grid{
        grid-template-columns:1fr;
    }

    .logo{
        font-size:30px;
    }
}
</style>
</head>

<body>

<div class="container">

<header>
    <div class="logo">JESSII KOLL</div>
    <div class="subtitle">Skolinfo samlad på ett ställe</div>
</header>


<!-- =========================
     SKOLBREV
========================= -->

<div class="card">

    <div class="title">
        Skolbrev
    </div>

    <textarea
        id="letter"
        placeholder="Klistra in hela skolbrevet här..."
    ></textarea>

    <button onclick="parseLetter()">
        LÄS BREVET
    </button>

    <div
        id="message"
        class="message hidden"
    ></div>

</div>


<!-- =========================
     EGEN INFORMATION
========================= -->

<div class="card">

    <div class="title">
        Egen information
    </div>

    <div class="grid">

        <input
            id="newDate"
            type="date"
        >

        <input
            id="newTime"
            type="time"
        >

    </div>

    <input
        id="newTitle"
        type="text"
        placeholder="Vad händer?"
        style="margin-top:10px"
    >

    <textarea
        id="newInfo"
        placeholder="Extra information"
        style="min-height:100px;margin-top:10px"
    ></textarea>

    <button onclick="addOwnEvent()">
        LÄGG TILL
    </button>

</div>


<!-- =========================
     KOMMANDE
========================= -->

<div class="card">

    <div class="title">
        Kommande
    </div>

    <div id="events"></div>

    <button
        class="secondary"
        onclick="clearAll()"
    >
        RADERA ALL INFORMATION
    </button>

</div>

</div>


<!-- =========================
     REDIGERA
========================= -->

<div
    id="editModal"
    class="modal hidden"
>

    <div class="modalBox">

        <div class="modalTitle">
            Redigera
        </div>

        <input
            id="editDate"
            type="date"
        >

        <input
            id="editTime"
            type="time"
            style="margin-top:10px"
        >

        <input
            id="editTitle"
            type="text"
            style="margin-top:10px"
        >

        <textarea
            id="editInfo"
            style="min-height:120px;margin-top:10px"
        ></textarea>

        <button onclick="saveEdit()">
            SPARA
        </button>

        <button
            class="secondary"
            onclick="closeEdit()"
        >
            AVBRYT
        </button>

    </div>

</div>


<script>

/* =========================================================
   INSTÄLLNINGAR
========================================================= */

const STORAGE_KEY = "jessii_koll_events_v3";

let events = [];

let editingId = null;


/* =========================================================
   START
========================================================= */

load();

render();


/* =========================================================
   LAGRING
========================================================= */

function load(){

    try{

        const saved =
            localStorage.getItem(STORAGE_KEY);

        if(saved){

            const data =
                JSON.parse(saved);

            if(Array.isArray(data)){

                events = data;

            }

        }

    }catch(error){

        events = [];

    }

}


function save(){

    localStorage.setItem(
        STORAGE_KEY,
        JSON.stringify(events)
    );

}


/* =========================================================
   HJÄLPFUNKTIONER
========================================================= */

function pad(number){

    return String(number).padStart(2,"0");

}


function escapeHTML(value){

    return String(value ?? "")
        .replace(/&/g,"&amp;")
        .replace(/</g,"&lt;")
        .replace(/>/g,"&gt;")
        .replace(/"/g,"&quot;")
        .replace(/'/g,"&#039;");

}


function today(){

    const d = new Date();

    return (
        d.getFullYear() +
        "-" +
        pad(d.getMonth()+1) +
        "-" +
        pad(d.getDate())
    );

}


function dateObject(value){

    const parts =
        value.split("-").map(Number);

    return new Date(
        parts[0],
        parts[1]-1,
        parts[2]
    );

}


function prettyDate(value){

    return new Intl.DateTimeFormat(
        "sv-SE",
        {
            day:"numeric",
            month:"long"
        }
    ).format(
        dateObject(value)
    );

}


function weekday(value){

    return new Intl.DateTimeFormat(
        "sv-SE",
        {
            weekday:"long"
        }
    ).format(
        dateObject(value)
    );

}


/* =========================================================
   MÅNADER
========================================================= */

const months = {

    januari:1,
    februari:2,
    mars:3,
    april:4,
    maj:5,
    juni:6,
    juli:7,
    augusti:8,
    september:9,
    oktober:10,
    november:11,
    december:12

};


/* =========================================================
   SKAPA DATUM
========================================================= */

function makeDate(day,month,year){

    day = Number(day);

    month = Number(month);

    let y =
        year
        ? Number(year)
        : new Date().getFullYear();


    let d =
        new Date(
            y,
            month-1,
            day
        );


    /*
       Om året saknas och datumet
       redan har passerat används
       nästa år.
    */

    if(
        !year &&
        d <
        new Date(
            new Date().getFullYear(),
            new Date().getMonth(),
            new Date().getDate()
        )
    ){

        y++;

        d =
            new Date(
                y,
                month-1,
                day
            );

    }


    /*
       Kontrollera att datumet verkligen
       existerar.
    */

    if(
        d.getFullYear() !== y ||
        d.getMonth() !== month-1 ||
        d.getDate() !== day
    ){

        return null;

    }


    return (
        y +
        "-" +
        pad(month) +
        "-" +
        pad(day)
    );

}


/* =========================================================
   DATUM
========================================================= */

function findAllDates(text){

    const found = [];


    /*
       Exempel:

       18 augusti
       18 augusti 2026
    */

    const words =
        /\b(\d{1,2})\s+(januari|februari|mars|april|maj|juni|juli|augusti|september|oktober|november|december)(?:\s+(20\d{2}))?\b/gi;


    let match;


    while(
        (match = words.exec(text)) !== null
    ){

        const month =
            months[
                match[2].toLowerCase()
            ];


        const date =
            makeDate(
                match[1],
                month,
                match[3]
            );


        if(date){

            found.push({

                date:date,

                index:match.index,

                end:
                    match.index +
                    match[0].length,

                raw:match[0]

            });

        }

    }


    /*
       Exempel:

       18/8
       18/08
       18/8/2026
       18-8
       18.8
    */

    const numbers =
        /\b(\d{1,2})\s*[\/.\-]\s*(\d{1,2})(?:\s*[\/.\-]\s*(20\d{2}))?\b/g;


    while(
        (match = numbers.exec(text)) !== null
    ){

        const date =
            makeDate(
                match[1],
                match[2],
                match[3]
            );


        if(date){

            found.push({

                date:date,

                index:match.index,

                end:
                    match.index +
                    match[0].length,

                raw:match[0]

            });

        }

    }


    /*
       Sortera efter placering
       i brevet.
    */

    found.sort(
        (a,b) =>
            a.index - b.index
    );


    /*
       Ta bort dubletter.
    */

    const unique = [];


    for(const item of found){

        const duplicate =
            unique.some(
                x =>
                    x.index === item.index &&
                    x.date === item.date
            );


        if(!duplicate){

            unique.push(item);

        }

    }


    return unique;

}


/* =========================================================
   TEXT RUNT DATUM
========================================================= */

function getContext(
    text,
    item,
    next
){

    /*
       Börja efter senaste punkt.
    */

    let start =
        text.lastIndexOf(
            ".",
            item.index
        ) + 1;


    /*
       Sluta vid nästa punkt.
    */

    let end =
        text.indexOf(
            ".",
            item.end
        );


    if(end === -1){

        end = text.length;

    }


    /*
       Om nästa datum ligger före
       punkten, sluta där istället.
    */

    if(
        next &&
        next.index < end
    ){

        end = next.index;

    }


    let context =
        text
            .substring(
                start,
                end
            )
            .replace(
                /\s+/g,
                " "
            )
            .trim();


    /*
       Om kontexten blev tom,
       använd texten efter datumet.
    */

    if(!context){

        context =
            text
                .substring(
                    item.end,
                    end
                )
                .replace(
                    /\s+/g,
                    " "
                )
                .trim();

    }


    return context;

}


/* =========================================================
   TID
========================================================= */

function getTime(text){

    /*
       Först intervall:

       14:00-16:00
       14:00 – 16:00
       kl. 14:00-16:00
    */

    let match =
        text.match(
            /\b(?:kl\.?\s*)?(\d{1,2})\s*:\s*(\d{2})\s*[-–]\s*(\d{1,2})\s*:\s*(\d{2})\b/i
        );


    if(match){

        return (
            pad(match[1]) +
            ":" +
            match[2] +
            "-" +
            pad(match[3]) +
            ":" +
            match[4]
        );

    }


    /*
       Enskild tid:

       8:15
       kl 8:15
       kl. 8:15
    */

    match =
        text.match(
            /\b(?:kl\.?\s*)?(\d{1,2})\s*:\s*(\d{2})\b/i
        );


    if(match){

        return (
            pad(match[1]) +
            ":" +
            match[2]
        );

    }


    return "";

}


/* =========================================================
   RENGÖR TEXT
========================================================= */

function cleanText(
    text,
    dateRaw
){

    let result = text;


    if(dateRaw){

        result =
            result.replace(
                dateRaw,
                ""
            );

    }


    /*
       Ta bort tider.
    */

    result =
        result.replace(
            /\b(?:kl\.?\s*)?\d{1,2}\s*:\s*\d{2}(?:\s*[-–]\s*\d{1,2}\s*:\s*\d{2})?\b/gi,
            ""
        );


    /*
       Ta bort veckodagar.
    */

    result =
        result.replace(
            /\b(måndag|tisdag|onsdag|torsdag|fredag|lördag|söndag)\b/gi,
            ""
        );


    result =
        result
            .replace(
                /^[\s,;:.\-–]+/,
                ""
            )
            .trim();


    return result;

}


/* =========================================================
   SMART RUBRIK
========================================================= */

function makeTitle(
    context,
    dateRaw
){

    const lower =
        context.toLowerCase();


    /*
       Specifika skolhändelser
       prioriteras.
    */

    if(
        lower.includes("skolstart")
    ){

        return "Skolstart";

    }


    if(
        lower.includes("föräldramöte")
    ){

        return "Föräldramöte";

    }


    if(
        lower.includes("utedag")
    ){

        return "Utedag";

    }


    if(
        lower.includes("studiedag")
    ){

        if(
            lower.includes(
                "eleverna är lediga"
            )
        ){

            return "Studiedag – LEDIGT";

        }

        return "Studiedag";

    }


    if(
        lower.includes(
            "komma till klassrummet"
        )
    ){

        return "Besök klassrummet";

    }


    let title =
        cleanText(
            context,
            dateRaw
        );


    /*
       Vanliga inledningar.
    */

    title =
        title.replace(
            /^(?:är det|kommer det|kommer|är|ska|har|den|på|och)\s+/i,
            ""
        );


    /*
       Exempel:

       kommer hela 4-6 att ha en utedag
    */

    title =
        title.replace(
            /^kommer hela .*? att ha\s+/i,
            ""
        );


    /*
       Ta bort avslutande
       "mer information..."
    */

    title =
        title.replace(
            /\s+mer information.*$/i,
            ""
        );


    /*
       Ta bort vissa vanliga
       informationsfraser.
    */

    title =
        title.replace(
            /\s+för mer information.*$/i,
            ""
        );


    title =
        title
            .replace(
                /^[,;:.\-–\s]+/,
                ""
            )
            .replace(
                /[,;:.\-–\s]+$/,
                ""
            )
            .trim();


    /*
       Om rubriken blev extremt lång,
       försök kapa den snyggt.
    */

    if(title.length > 90){

        title =
            title
                .slice(0,90)
                .trim() +
            "...";

    }


    if(!title){

        title = "Skolinformation";

    }


    return (
        title.charAt(0).toUpperCase() +
        title.slice(1)
    );

}


/* =========================================================
   EXTRA INFORMATION
========================================================= */

function makeInfo(
    context
){

    const lower =
        context.toLowerCase();

    const info = [];


    if(
        lower.includes(
            "samlas på skolgården"
        )
    ){

        info.push(
            "Samling på skolgården."
        );

    }


    if(
        lower.includes("vedema")
    ){

        info.push(
            "Plats: Vedema."
        );

    }


    if(
        lower.includes(
            "eleverna är lediga"
        )
    ){

        info.push(
            "Eleverna är lediga."
        );

    }


    if(
        lower.includes(
            "komma till klassrummet"
        )
    ){

        info.push(
            "Möjlighet att komma till klassrummet."
        );

    }


    if(
        lower.includes(
            "mer information"
        )
    ){

        info.push(
            "Mer information finns i skolbrevet."
        );

    }


    return info.join("\n");

}


/* =========================================================
   LÄS SKOLBREV
========================================================= */

function parseLetter(){

    const text =
        document
            .getElementById("letter")
            .value
            .trim();


    if(!text){

        showMessage(
            "Klistra in skolbrevet först."
        );

        return;

    }


    const dates =
        findAllDates(text);


    if(!dates.length){

        showMessage(
            "Jag hittar inga datum i brevet."
        );

        return;

    }


    let added = 0;


    for(
        let i = 0;
        i < dates.length;
        i++
    ){

        const item =
            dates[i];


        const next =
            dates[i + 1];


        const context =
            getContext(
                text,
                item,
                next
            );


        const time =
            getTime(context);


        const title =
            makeTitle(
                context,
                item.raw
            );


        const info =
            makeInfo(context);


        if(
            addEvent(
                item.date,
                time,
                title,
                info,
                "SKOLBREV"
            )
        ){

            added++;

        }

    }


    save();

    render();


    showMessage(
        "Klart! " +
        dates.length +
        " datum hittades och " +
        added +
        " nya händelser lades till."
    );

}


/* =========================================================
   MEDDELANDE
========================================================= */

function showMessage(text){

    const box =
        document.getElementById(
            "message"
        );


    box.textContent = text;

    box.classList.remove(
        "hidden"
    );

}


/* =========================================================
   LÄGG TILL EGEN HÄNDELSE
========================================================= */

function addOwnEvent(){

    const date =
        document
            .getElementById("newDate")
            .value;


    const time =
        document
            .getElementById("newTime")
            .value;


    const title =
        document
            .getElementById("newTitle")
            .value
            .trim();


    const info =
        document
            .getElementById("newInfo")
            .value
            .trim();


    if(!date){

        alert(
            "Välj datum."
        );

        return;

    }


    if(!title){

        alert(
            "Skriv vad som händer."
        );

        return;

    }


    addEvent(
        date,
        time,
        title,
        info,
        "EGEN"
    );


    save();

    render();


    document
        .getElementById("newTitle")
        .value = "";


    document
        .getElementById("newInfo")
        .value = "";

}


/* =========================================================
   LÄGG TILL HÄNDELSE
========================================================= */

function addEvent(
    date,
    time,
    title,
    info,
    source
){

    /*
       Förhindra identiska händelser.
    */

    const duplicate =
        events.find(
            event =>
                event.date === date &&
                event.time === (time || "") &&
                String(event.title)
                    .toLowerCase() ===
                String(title)
                    .toLowerCase()
        );


    if(duplicate){

        /*
           Om den nya informationen
           innehåller något nytt,
           lägg till den.
        */

        if(
            info &&
            !String(
                duplicate.info || ""
            ).includes(info)
        ){

            duplicate.info =
                duplicate.info
                ? duplicate.info +
                  "\n" +
                  info
                : info;

        }


        return false;

    }


    events.push({

        id:
            Date.now() +
            Math.random(),

        date:
            date,

        time:
            time || "",

        title:
            title,

        info:
            info || "",

        source:
            source || "EGEN"

    });


    return true;

}


/* =========================================================
   REDIGERA HÄNDELSE
========================================================= */

function editEvent(id){

    const event =
        events.find(
            item =>
                item.id === id
        );


    if(!event){

        return;

    }


    editingId = id;


    document
        .getElementById("editDate")
        .value =
            event.date;


    document
        .getElementById("editTime")
        .value =
            event.time || "";


    document
        .getElementById("editTitle")
        .value =
            event.title || "";


    document
        .getElementById("editInfo")
        .value =
            event.info || "";


    document
        .getElementById("editModal")
        .classList.remove(
            "hidden"
        );

}


/* =========================================================
   STÄNG REDIGERING
========================================================= */

function closeEdit(){

    editingId = null;


    document
        .getElementById("editModal")
        .classList.add(
            "hidden"
        );

}


/* =========================================================
   SPARA REDIGERING
========================================================= */

function saveEdit(){

    const event =
        events.find(
            item =>
                item.id === editingId
        );


    if(!event){

        return;

    }


    const date =
        document
            .getElementById("editDate")
            .value;


    const time =
        document
            .getElementById("editTime")
            .value;


    const title =
        document
            .getElementById("editTitle")
            .value
            .trim();


    const info =
        document
            .getElementById("editInfo")
            .value
            .trim();


    if(!date){

        alert(
            "Välj datum."
        );

        return;

    }


    if(!title){

        alert(
            "Skriv en rubrik."
        );

        return;

    }


    event.date =
        date;


    event.time =
        time;


    event.title =
        title;


    event.info =
        info;


    save();

    render();

    closeEdit();

}


/* =========================================================
   TA BORT EN HÄNDELSE
========================================================= */

function deleteEvent(id){

    events =
        events.filter(
            event =>
                event.id !== id
        );


    save();

    render();

}


/* =========================================================
   RADERA ALLT
========================================================= */

function clearAll(){

    if(
        !confirm(
            "Radera all information?"
        )
    ){

        return;

    }


    events = [];


    save();

    render();

}


/* =========================================================
   VISA HÄNDELSER
========================================================= */

function render(){

    const box =
        document.getElementById(
            "events"
        );


    if(!events.length){

        box.innerHTML = `
            <div class="empty">
                Inga händelser ännu.
            </div>
        `;

        return;

    }


    /*
       Sortera kronologiskt.
    */

    events.sort(
        (a,b) => {

            const aValue =
                String(a.date || "") +
                String(a.time || "");

            const bValue =
                String(b.date || "") +
                String(b.time || "");

            return aValue.localeCompare(
                bValue
            );

        }
    );


    /*
       Gruppera efter datum.
    */

    const groups = {};


    events.forEach(
        event => {

            if(!groups[event.date]){

                groups[event.date] = [];

            }


            groups[event.date].push(
                event
            );

        }
    );


    let html = "";


    Object
        .keys(groups)
        .sort()
        .forEach(
            date => {

                html += `

                    <div class="day">

                        <div class="dayHeader">

                            <div>

                                <div class="weekday">
                                    ${escapeHTML(
                                        weekday(date)
                                    )}
                                </div>

                                <div class="date">
                                    ${escapeHTML(
                                        prettyDate(date)
                                    )}
                                </div>

                            </div>

                            ${
                                date === today()
                                ?
                                `
                                <div class="today">
                                    IDAG
                                </div>
                                `
                                :
                                ""
                            }

                        </div>
                `;


                groups[date].forEach(
                    event => {

                        html += `

                            <div class="event">

                                ${
                                    event.time
                                    ?
                                    `
                                    <div class="time">
                                        ${escapeHTML(
                                            event.time
                                        )}
                                    </div>
                                    `
                                    :
                                    ""
                                }

                                <div class="eventTitle">
                                    ${escapeHTML(
                                        event.title
                                    )}
                                </div>

                                ${
                                    event.info
                                    ?
                                    `
                                    <div class="eventInfo">
                                        ${escapeHTML(
                                            event.info
                                        )}
                                    </div>
                                    `
                                    :
                                    ""
                                }

                                <div class="source">
                                    ${escapeHTML(
                                        event.source
                                    )}
                                </div>

                                <div class="buttons">

                                    <button
                                        class="secondary"
                                        onclick="editEvent(${event.id})"
                                    >
                                        REDIGERA
                                    </button>

                                    <button
                                        class="danger"
                                        onclick="deleteEvent(${event.id})"
                                    >
                                        TA BORT
                                    </button>

                                </div>

                            </div>

                        `;

                    }
                );


                html += `

                    </div>

                `;

            }
        );


    box.innerHTML = html;

}


/* =========================================================
   STÄNG MODAL MED ESC
========================================================= */

document.addEventListener(
    "keydown",
    function(event){

        if(
            event.key === "Escape"
        ){

            closeEdit();

        }

    }
);


/* =========================================================
   KLICK UTANFÖR MODAL
========================================================= */

document
    .getElementById("editModal")
    .addEventListener(
        "click",
        function(event){

            if(
                event.target === this
            ){

                closeEdit();

            }

        }
    );

</script>

</body>
</html>
