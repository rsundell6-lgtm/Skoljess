<!DOCTYPE html>
<html lang="sv">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Skoljess</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    padding: 15px;
    background: #0e1013;
    color: #fff;
    font-family: Arial, sans-serif;
}

h1 {
    text-align: center;
    margin: 10px 0 20px;
}

h2 {
    margin-top: 0;
}

.card {
    background: #191c21;
    border-radius: 15px;
    padding: 15px;
    margin-bottom: 15px;
}

textarea {
    width: 100%;
    min-height: 220px;
    background: #252930;
    color: #fff;
    border: 1px solid #3a3f48;
    border-radius: 10px;
    padding: 12px;
    font-size: 16px;
    resize: vertical;
}

button {
    width: 100%;
    border: 0;
    border-radius: 10px;
    padding: 14px;
    margin-top: 10px;
    background: #3478f6;
    color: #fff;
    font-size: 16px;
    font-weight: bold;
}

button.danger {
    background: #8b3030;
}

button.secondary {
    background: #30343b;
}

.event {
    background: #252930;
    border-radius: 12px;
    padding: 14px;
    margin-top: 10px;
    border-left: 4px solid #3478f6;
}

.date {
    color: #79a6ff;
    font-weight: bold;
    font-size: 17px;
}

.title {
    font-size: 18px;
    font-weight: bold;
    margin-top: 7px;
}

.time {
    font-size: 17px;
    font-weight: bold;
    margin-top: 7px;
}

.info {
    color: #aaa;
    margin-top: 7px;
    line-height: 1.5;
    white-space: pre-wrap;
}

.original {
    color: #777;
    font-size: 13px;
    margin-top: 10px;
}

.check {
    float: right;
}

.check input {
    width: 23px;
    height: 23px;
}

.edit {
    width: 100%;
    background: #30343b;
    color: #fff;
    border: 1px solid #454a53;
    border-radius: 8px;
    padding: 10px;
    margin-top: 8px;
    font-size: 15px;
}

textarea.edit {
    min-height: 100px;
}

.hidden {
    display: none;
}

.empty {
    color: #777;
    text-align: center;
    padding: 20px;
}

.status {
    text-align: center;
    color: #aaa;
    font-size: 13px;
    margin-bottom: 15px;
}

.error {
    background: #421f1f;
    border: 1px solid #8b3030;
    color: #ffb0b0;
    padding: 12px;
    border-radius: 10px;
    margin-bottom: 15px;
    white-space: pre-wrap;
}

.success {
    background: #1d3b25;
    border: 1px solid #39734a;
    color: #a8e6b8;
    padding: 12px;
    border-radius: 10px;
    margin-bottom: 15px;
}

</style>
</head>

<body>

<h1>Jessii Koll</h1>

<div id="message"></div>

<div class="status" id="status">
Ansluter till Skoljess...
</div>


<div class="card">

<h2>Skolmeddelande</h2>

<textarea
id="schoolText"
placeholder="Klistra in meddelandet från skolan här..."
></textarea>

<button onclick="analyzeText()">
Tolka meddelandet
</button>

</div>


<div class="card hidden" id="previewCard">

<h2>Hittade händelser</h2>

<div id="preview"></div>

<button onclick="saveSelected()">
Spara valda
</button>

<button class="secondary" onclick="closePreview()">
Avbryt
</button>

</div>


<div class="card">

<h2>Kommande</h2>

<div id="events">
<div class="empty">
Hämtar schema...
</div>
</div>

</div>


<script type="module">

/* =====================================================
   FIREBASE
===================================================== */

import { initializeApp }
from "https://www.gstatic.com/firebasejs/12.1.0/firebase-app.js";

import {
    getFirestore,
    collection,
    addDoc,
    deleteDoc,
    doc,
    onSnapshot
}
from "https://www.gstatic.com/firebasejs/12.1.0/firebase-firestore.js";


const firebaseConfig = {

    apiKey:
    "AIzaSyC4HbUAHWoiBcm7WDfzJZnL8HjpWf26TmM",

    authDomain:
    "skoljess-4ce58.firebaseapp.com",

    projectId:
    "skoljess-4ce58",

    storageBucket:
    "skoljess-4ce58.firebasestorage.app",

    messagingSenderId:
    "377684096428",

    appId:
    "1:377684096428:web:2c7a493b615ef128d37609",

    measurementId:
    "G-41KT9N1DRE"
};


let app;
let db;
let eventsRef;


/* =====================================================
   FELMEDDELANDE
===================================================== */

function showError(text) {

    document.getElementById("message").innerHTML = `
        <div class="error">${safe(text)}</div>
    `;

}


function showSuccess(text) {

    document.getElementById("message").innerHTML = `
        <div class="success">${safe(text)}</div>
    `;

}


/* =====================================================
   INITIERA FIREBASE
===================================================== */

try {

    app = initializeApp(firebaseConfig);

    db = getFirestore(app);

    eventsRef = collection(db, "events");

    document.getElementById("status").textContent =
        "Ansluten till Skoljess";

}
catch (error) {

    console.error(error);

    document.getElementById("status").textContent =
        "Firebase kunde inte starta";

    showError(
        "Firebase-fel:\n" +
        error.message
    );

}


/* =====================================================
   HÄMTA HÄNDELSER
===================================================== */

if (eventsRef) {

    onSnapshot(

        eventsRef,

        function(snapshot) {

            const loaded = [];

            snapshot.forEach(function(item) {

                loaded.push({

                    id: item.id,

                    ...item.data()

                });

            });


            events = loaded;

            sortEvents();

            showEvents();

            document.getElementById("status").textContent =
                "Synkad med Firebase";

        },

        function(error) {

            console.error(error);

            document.getElementById("status").textContent =
                "Fel vid hämtning";

            showError(
                "Kunde inte läsa schemat från Firebase.\n\n" +
                error.code +
                "\n" +
                error.message
            );

        }

    );

}


/* =====================================================
   DATA
===================================================== */

let events = [];

let detected = [];


/* =====================================================
   MÅNADER
===================================================== */

const months = {

    januari: 1,
    februari: 2,
    mars: 3,
    april: 4,
    maj: 5,
    juni: 6,
    juli: 7,
    augusti: 8,
    september: 9,
    oktober: 10,
    november: 11,
    december: 12

};


function monthName(number) {

    for (const name in months) {

        if (months[name] === number) {

            return name;

        }

    }

    return "";

}


/* =====================================================
   ÅR
===================================================== */

function getYear(month) {

    const now = new Date();

    let year = now.getFullYear();

    const currentMonth =
        now.getMonth() + 1;

    if (month < currentMonth - 2) {

        year++;

    }

    return year;

}


/* =====================================================
   SKYDDA HTML
===================================================== */

function safe(text) {

    return String(text || "")
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");

}


/* =====================================================
   DATUM
===================================================== */

function findDates(text) {

    const result = [];

    const regex =
        /(\d{1,2})\s*(?:\/|-|\.)\s*(\d{1,2})|(\d{1,2})\s+(januari|februari|mars|april|maj|juni|juli|augusti|september|oktober|november|december)/gi;

    let match;

    while ((match = regex.exec(text)) !== null) {

        let day;
        let month;

        if (match[1]) {

            day = parseInt(match[1]);

            month = parseInt(match[2]);

        }
        else {

            day = parseInt(match[3]);

            month =
                months[
                    match[4].toLowerCase()
                ];

        }


        if (
            day >= 1 &&
            day <= 31 &&
            month >= 1 &&
            month <= 12
        ) {

            result.push({

                day: day,

                month: month,

                year: getYear(month),

                index: match.index

            });

        }

    }

    return result;

}


/* =====================================================
   TIDER
===================================================== */

function findTimes(text) {

    const result = [];

    const regex =
        /\b\d{1,2}\s*[:.]\s*\d{2}\b/g;

    let match;

    while ((match = regex.exec(text)) !== null) {

        result.push({

            text:
                match[0]
                    .replace(".", ":")
                    .replace(/\s/g, ""),

            index: match.index

        });

    }

    return result;

}


/* =====================================================
   KONTEXT
===================================================== */

function getContext(text, index) {

    let start =
        text.lastIndexOf(".", index);

    let end =
        text.indexOf(".", index);


    if (start === -1) {

        start = 0;

    }
    else {

        start++;

    }


    if (end === -1) {

        end = text.length;

    }


    return text
        .substring(start, end)
        .replace(/\s+/g, " ")
        .trim();

}


/* =====================================================
   RUBRIK
===================================================== */

function getTitle(text) {

    const t = text.toLowerCase();


    if (t.includes("skolstart"))
        return "Skolstart";

    if (t.includes("föräldramöte"))
        return "Föräldramöte";

    if (t.includes("studiedag"))
        return "Studiedag";

    if (t.includes("utedag"))
        return "Utedag";

    if (t.includes("utflykt"))
        return "Utflykt";

    if (t.includes("friluftsdag"))
        return "Friluftsdag";

    if (t.includes("klassrummet"))
        return "Besök klassrummet";

    if (t.includes("lov"))
        return "Lov";

    if (t.includes("ledig"))
        return "Ledig dag";

    if (t.includes("möte"))
        return "Möte";


    return "Skolhändelse";

}


/* =====================================================
   PLATS
===================================================== */

function getPlace(text) {

    const t = text.toLowerCase();


    const places = [

        ["vedema", "Vedema"],
        ["skolgården", "Skolgården"],
        ["klassrummet", "Klassrummet"],
        ["idrottshallen", "Idrottshallen"],
        ["biblioteket", "Biblioteket"],
        ["simhallen", "Simhallen"]

    ];


    for (const place of places) {

        if (t.includes(place[0])) {

            return place[1];

        }

    }


    return "";

}


/* =====================================================
   EXTRA INFO
===================================================== */

function getInfo(text) {

    const result = [];

    const t = text.toLowerCase();


    if (t.includes("eleverna är lediga")) {

        result.push(
            "Eleverna är lediga"
        );

    }


    if (t.includes("mer information")) {

        result.push(
            "Mer information kommer"
        );

    }


    const take =
        t.indexOf("ta med");


    if (take >= 0) {

        result.push(
            text.substring(take)
        );

    }


    return result.join(" • ");

}


/* =====================================================
   SORTERA
===================================================== */

function sortEvents() {

    events.sort(function(a, b) {

        const A =
            new Date(
                a.year,
                a.month - 1,
                a.day
            );

        const B =
            new Date(
                b.year,
                b.month - 1,
                b.day
            );

        return A - B;

    });

}


/* =====================================================
   DUBBLETT
===================================================== */

function isDuplicate(event) {

    return events.some(function(old) {

        return (

            old.day == event.day &&

            old.month == event.month &&

            old.year == event.year &&

            String(old.title).toLowerCase()
            ===
            String(event.title).toLowerCase()

        );

    });

}


/* =====================================================
   TOLKA MEDDELANDE
===================================================== */

window.analyzeText = function() {

    const text =
        document
            .getElementById("schoolText")
            .value
            .trim();


    if (!text) {

        alert(
            "Klistra in skolans meddelande först."
        );

        return;

    }


    const dates =
        findDates(text);

    const times =
        findTimes(text);


    detected = [];


    for (const date of dates) {

        const context =
            getContext(
                text,
                date.index
            );


        let localTimes = [];


        for (const time of times) {

            if (
                Math.abs(
                    time.index - date.index
                ) < 300
            ) {

                localTimes.push(
                    time.text
                );

            }

        }


        if (localTimes.length > 2) {

            localTimes =
                localTimes.slice(0, 2);

        }


        const event = {

            day: date.day,

            month: date.month,

            year: date.year,

            title:
                getTitle(context),

            place:
                getPlace(context),

            info:
                getInfo(context),

            times:
                localTimes,

            original:
                context

        };


        const duplicate =
            detected.some(function(x) {

                return (

                    x.day == event.day &&
                    x.month == event.month &&
                    x.year == event.year &&
                    x.title == event.title

                );

            });


        if (!duplicate) {

            detected.push(event);

        }

    }


    showPreview();

};


/* =====================================================
   VISA FÖRHANDSVISNING
===================================================== */

function showPreview() {

    const box =
        document.getElementById("preview");


    box.innerHTML = "";


    if (!detected.length) {

        box.innerHTML =
            `<div class="empty">
                Inga datum hittades.
            </div>`;

    }


    detected.forEach(function(e, i) {

        box.innerHTML += `

        <div class="event">

            <div class="check">

                <input
                    type="checkbox"
                    id="keep_${i}"
                    checked>

            </div>


            <div class="date">

                ${e.day}
                ${monthName(e.month)}
                ${e.year}

            </div>


            <input
                class="edit"
                id="title_${i}"
                value="${safe(e.title)}"
                placeholder="Rubrik">


            <input
                class="edit"
                id="time_${i}"
                value="${safe(
                    e.times.join(" – ")
                )}"
                placeholder="Tid">


            <input
                class="edit"
                id="place_${i}"
                value="${safe(e.place)}"
                placeholder="Plats">


            <textarea
                class="edit"
                id="info_${i}"
                placeholder="Information">${safe(e.info)}</textarea>


            <div class="original">

                ${safe(e.original)}

            </div>

        </div>

        `;

    });


    document
        .getElementById("previewCard")
        .classList.remove("hidden");

}


/* =====================================================
   SPARA
===================================================== */

window.saveSelected = async function() {

    let saved = 0;


    for (
        let i = 0;
        i < detected.length;
        i++
    ) {

        const checkbox =
            document.getElementById(
                "keep_" + i
            );


        if (
            !checkbox ||
            !checkbox.checked
        ) {

            continue;

        }


        const title =
            document
                .getElementById(
                    "title_" + i
                )
                .value
                .trim();


        const time =
            document
                .getElementById(
                    "time_" + i
                )
                .value
                .trim();


        const place =
            document
                .getElementById(
                    "place_" + i
                )
                .value
                .trim();


        const info =
            document
                .getElementById(
                    "info_" + i
                )
                .value;


        const newEvent = {

            day:
                detected[i].day,

            month:
                detected[i].month,

            year:
                detected[i].year,

            title:
                title || "Skolhändelse",

            times:
                time
                    ? [time]
                    : [],

            place:
                place,

            info:
                info,

            original:
                detected[i].original,

            created:
                Date.now()

        };


        if (isDuplicate(newEvent)) {

            continue;

        }


        try {

            await addDoc(
                eventsRef,
                newEvent
            );

            saved++;

        }
        catch (error) {

            console.error(error);

            showError(
                "FEL VID SPARANDE:\n\n" +
                error.code +
                "\n" +
                error.message
            );

            return;

        }

    }


    closePreview();


    document
        .getElementById("schoolText")
        .value = "";


    detected = [];


    showSuccess(
        saved +
        " händelse" +
        (saved === 1 ? "" : "r") +
        " sparad" +
        (saved === 1 ? "" : "e") +
        " i molnet."
    );

};


/* =====================================================
   STÄNG FÖRHANDSVISNING
===================================================== */

window.closePreview = function() {

    document
        .getElementById("previewCard")
        .classList.add("hidden");

};


/* =====================================================
   VISA HÄNDELSER
===================================================== */

function showEvents() {

    const box =
        document.getElementById("events");


    if (!events.length) {

        box.innerHTML =
            `<div class="empty">
                Inga sparade händelser.
            </div>`;

        return;

    }


    box.innerHTML = "";


    events.forEach(function(e) {

        box.innerHTML += `

        <div class="event">

            <div class="date">

                ${e.day}
                ${monthName(e.month)}
                ${e.year}

            </div>


            <div class="title">

                ${safe(e.title)}

            </div>


            ${
                e.times &&
                e.times.length
                ?
                `
                <div class="time">

                    ${safe(
                        e.times.join(" – ")
                    )}

                </div>
                `
                :
                ""
            }


            ${
                e.place
                ?
                `
                <div class="info">

                    Plats: ${safe(e
